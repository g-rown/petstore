server:
  port: 8080
  servlet:
    context-path: /gulles

spring:
  application:
    name: petstore-backend
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-secret-key-min-256-bits-long-for-hs256-algorithm-petstore}
  expiration: 86400000

logging:
  level:
    com.petstore: INFO
