services:
  # Backend Web Service
  - type: web
    name: petstore-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /gulles/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petstore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FRONTEND_URL
        value: https://petstore-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: petstore-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        value: https://petstore-backend.onrender.com/gulles/v1

databases:
  # PostgreSQL Database
  - name: petstore-db
    plan: free
    region: oregon
    postgresMajorVersion: 15
